name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lente_test
          POSTGRES_USER: lente
          POSTGRES_PASSWORD: lente-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lente -d lente_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://lente:lente-test@localhost:5432/lente_test
      TEST_DATABASE_URL: postgresql+psycopg://lente:lente-test@localhost:5432/lente_test
      PYTHONPATH: apps/api/src:workers/ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e './apps/api[dev]'
      - run: ruff check apps/api workers/ingestion
      - run: alembic upgrade head
        working-directory: apps/api
      - run: pytest -q
        working-directory: apps/api

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm", cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build api web

