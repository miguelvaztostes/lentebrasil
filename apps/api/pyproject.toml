[project]
name = "lente-ribeirao-api"
version = "0.1.0"
description = "API pública e ingestão do Lente Ribeirão"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.20.0",
  "dbfread==2.0.7",
  "cryptography==46.0.3",
  "duckdb==1.4.1",
  "fastapi==0.143.0",
  "httpx==0.28.1",
  "openpyxl==3.1.5",
  "psycopg[binary]==3.3.6",
  "pyreaddbc==2.0.4",
  "py7zr==1.1.4",
  "pyxlsb==1.0.10",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.20",
  "python-dateutil==2.9.0.post0",
  "rarfile==4.2",
  "sqlalchemy==2.1.4",
  "tenacity==9.2.1",
  "typer==0.27.3",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "../../workers/ingestion"]
testpaths = ["tests"]
markers = ["integration: requires a PostgreSQL TEST_DATABASE_URL"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

